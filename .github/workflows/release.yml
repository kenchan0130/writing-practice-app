name: Release

# main への push で tagpr がリリースのプルリクエストを作り、マージでタグを打つ。
# タグを打つと Xcode Cloud のビルドが動き、TestFlight に届く（D130。Xcode Cloud 側でタグを開始条件にする）。
on:
  push:
    branches: ["main"]

# リリースのプルリクエストとタグは、1つずつ順に作る（途中で取り消さない）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # tagpr require this credential
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
